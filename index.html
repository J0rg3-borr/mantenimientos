<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Menú Principal - Mantenimientos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 0;
    }
    .header {
      background: #f58220;
      padding: 0;
    }
    .navbar {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 80px;
      border-bottom: 1px solid #eee;
    }
    .logo {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      padding: 10px 0;
    }
    .logo-text {
      font-size: 40px;
      font-weight: bold;
      color: #f58220;
      letter-spacing: 2px;
      margin-bottom: 0;
      margin-top: 0;
    }
    .logo-sub {
      font-size: 16px;
      color: #f58220;
      margin-top: 2px;
    }
    .nav-menu {
      display: flex;
      gap: 40px;
    }
    .nav-link {
      color: #f58220;
      text-decoration: none;
      font-size: 22px;
      font-weight: 500;
      position: relative;
      padding-bottom: 4px;
      transition: color 0.2s;
    }
    .nav-link.active, .nav-link:hover {
      color: #333;
    }
    .nav-link.active::after {
      content: '';
      display: block;
      margin: 0 auto;
      width: 60%;
      border-bottom: 3px solid #333;
      margin-top: 2px;
    }
    .banner-img {
      width: 100vw;
      max-width: 100%;
      height: calc(100vh - 80px);
      display: block;
      margin: 0;
      padding: 0;
      object-fit: cover;
    }
    @media (max-width: 768px) {
      .banner-img {
        height: 40vh;
      }
      .navbar {
        flex-direction: column;
        height: auto;
        padding: 10px 10px;
      }
      .nav-menu {
        gap: 20px;
      }
      .logo-text {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="navbar">
      <div class="logo">
        <span class="logo-text">ZINKO</span>
        <span class="logo-sub">Soluciones Tecnológicas</span>
      </div>
      <div class="nav-index">
        <a href="Registro.html" class="nav-link">Registro de Equipos</a>
        <a href="calendario.html" class="nav-link">Calendario de Mantenimientos</a>
      </div>
    </div>
  </div>
  <img src="https://assistemas.net/wp-content/uploads/2025/08/AI-Transformando-PYM.jpg" class="banner-img">
</body>
</html>
